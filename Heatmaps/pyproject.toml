[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landmark-heatmaps"
version = "0.1.0"
description = "Heatmap-regression landmark localisation package."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LandmarkIdentificationFrameworks"}]
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "opencv-python",
    "scikit-image",
    "openpyxl"
]

[project.scripts]
heatmaps-train = "Heatmaps.heatmap_training_pipeline:main"
heatmaps-generate-folds = "Heatmaps.utils.generate_folds:main"
heatmaps-calculate-image-size = "Heatmaps.utils.calculate_image_size:main"

[tool.setuptools.packages.find]
include = ["Heatmaps*"]
